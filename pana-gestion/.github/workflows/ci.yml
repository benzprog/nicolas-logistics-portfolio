name: CI

# Corre en cada push y en cada pull request. Las tres verificaciones son
# independientes a propósito: si falla el esquema de la base, igual queremos
# saber si además falla el lint.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

  base-de-datos:
    name: Migraciones y reglas de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El script levanta su propio PostgreSQL, aplica las migraciones desde
      # cero y verifica que nadie llegue a los tokens ni pueda escribir lo que
      # no le corresponde. Ubuntu ya trae los binarios instalados.
      - name: Aplicar migraciones y correr las pruebas de RLS
        run: sudo ./scripts/check-migrations.sh

  extremo-a-extremo:
    name: Recorrido completo en el navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar el navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: pnpm test:e2e

      - name: Guardar el informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7

  compilar:
    name: Build de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El build no necesita secretos reales: lib/env.ts valida en runtime, no
      # al compilar, justamente para que esto no obligue a poner credenciales
      # verdaderas en la integración continua.
      - name: Compilar
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://ejemplo.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-compilacion
